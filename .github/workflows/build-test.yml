name: Build & Test

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazelisk
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install bazelisk 2>/dev/null || true
          bazel --version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Create stub team_config.bzl
        run: cp imujoco/app/team_config.bzl.template imujoco/app/team_config.bzl

      - name: Build (driver, core, protocol, schema)
        run: bazel build //driver/... //imujoco/core/... //protocol/... //schema/...

      - name: Run tests (driver, core)
        run: bazel test //driver/... //imujoco/core/... --test_output=errors
